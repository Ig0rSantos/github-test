<body>
    <h1>Parte II – conteúdo multimédia  </h1>

<!--Elementos de multimédia são comummente usados em páginas HTML, com as tags abaixo vamos analisar como adicionar áudio e vídeos a uma página HTML. 

<audio> - usado para inserir um áudio.   

<video> - usado para inserir um vídeo.  

<iframe> - usado para inserir vários tipos de conteúdo na web, por exemplo uma página web dentro da nossa página ou um vídeo do YouTube. -->


    <!--Atributos Importantes a Conhecer:
Atributos de <audio> e <video>:

 - controls: Mostra os botões de reproduzir, pausar, volume e barra de progresso.

 - autoplay: Inicia a reprodução automaticamente (muitos navegadores bloqueiam se houver som).

 - loop: Faz o ficheiro repetir continuamente.

 - muted: Silencia o som por defeito.

 - poster (apenas para <video>): Define uma imagem de pré-visualização antes de o vídeo ser reproduzido.

 - <source>: Permite colocar vários formatos do mesmo ficheiro (ex: .mp4 e .webm). O navegador usará o primeiro formato que suportar.-->

<div class="media-card">
    <h3>Exemplo de áudio</h3>
    <p> Ouvir a muica</p>
     <audio controls>
        <source src="../PL03/media/purrplecat-long-day-518602.mp3" type="audio/mpeg">
     </audio>
    </div>


<div>
    <div class="media-card img">
    <h3>Exemplo de vídeo</h3>
    <p>Assistir ao video</p>
     <video controls width="100%"> 
        <source src="../PL03/media/384849_medium.mp4" type="video/mp4">
     </video>
</div>


<div class="media-card img">
    <h3>Video do Youtube</h3>
    <p>Assistir a um video ditretamente do youtube</p>
    <!--ir para o video, clicar partilhar, escolher opcao "incorporar"-->
<iframe width="560" height="315" src="https://www.youtube.com/embed/ZGO2It1eQF8?si=m4rX69_gR6tvJqXX" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>


<div class="media-card iframe">
    <h3>Exemplo de iframe</h3>
    <p>Website externo</p>
        <iframe src="https://cesaedigital.pt/fldrSite/default.aspx" width="600" height="400" title="Website do cesae digital"></iframe>
</div> 


</body>    
</html>
